name: Publish the ocelhq floci image

# ocelhq's fork carries the streamed-response and stage-variable fixes ocel's
# journey lane needs. Every push to an ocel/* branch publishes
# ghcr.io/ocelhq/floci:<branch> and :sha-<commit>; a v*-ocel.* tag publishes
# that version and moves :latest.

on:
  push:
    branches: ["ocel/**"]
    tags: ["v*-ocel.*"]
  workflow_dispatch:

permissions: {}

concurrency:
  group: publish-ocel-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - id: version
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "value=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${GITHUB_REF_NAME//\//-}-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/floci
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-
            type=match,pattern=v(.*),group=1,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
          labels: |
            org.opencontainers.image.title=floci
            org.opencontainers.image.version=${{ steps.version.outputs.value }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ steps.version.outputs.value }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
